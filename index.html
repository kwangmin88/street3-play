<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>스트릿3</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none}
iframe{position:fixed;left:0;top:0;border:0;transform-origin:0 0}
</style>
</head>
<body>
<iframe id="g" src="game.html" allow="autoplay; fullscreen"></iframe>
<script>
// 늘 가로로 보여준다 — 화면이 세로면 게임을 90도 돌려서 그린다 (터치 좌표는 브라우저가 맞춰 준다)
var g = document.getElementById('g');
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  if (h > w) {
    g.style.width = h + 'px'; g.style.height = w + 'px';
    g.style.transform = 'translateX(' + w + 'px) rotate(90deg)';
  } else {
    g.style.width = w + 'px'; g.style.height = h + 'px';
    g.style.transform = 'none';
  }
}
fit();
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
</script>
</body>
</html>
